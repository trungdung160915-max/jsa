<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Novafulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030305;
            color: #d0d0df;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 30px;
        }

        /* Header quản trị */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px auto;
            background: linear-gradient(135deg, #0a0a0f 0%, #050508 100%);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .admin-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, #ff0055, #ff9900);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .logo span {
            background: linear-gradient(90deg, #ff0055, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            background: transparent;
            color: #ff0055;
            border: 1px solid rgba(255, 0, 85, 0.4);
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
        }

        /* Container chính */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        /* Thống kê nhanh */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #0a0a0f 0%, #050508 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .stat-card h4 {
            font-size: 13px;
            color: #888899;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff0055, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Khu vực quản lý & nút Thêm mới */
        .management-section {
            background: linear-gradient(135deg, #0a0a0f 0%, #050508 100%);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .add-btn {
            background: linear-gradient(90deg, #ff0055, #ff9900);
            border: none;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.4);
        }

        /* Bảng dữ liệu */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            color: #888899;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.02);
        }

        td {
            color: #d0d0df;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .edit-btn, .delete-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .edit-btn {
            background: rgba(0, 170, 255, 0.15);
            color: #00aaff;
            border: 1px solid rgba(0, 170, 255, 0.3);
        }

        .edit-btn:hover {
            background: #00aaff;
            color: #ffffff;
        }

        .delete-btn {
            background: rgba(255, 0, 85, 0.15);
            color: #ff0055;
            border: 1px solid rgba(255, 0, 85, 0.3);
        }

        .delete-btn:hover {
            background: #ff0055;
            color: #ffffff;
        }

        .empty-row {
            text-align: center;
            color: #666677;
            padding: 30px;
        }
    </style>
</head>
<body>

    <!-- Header Quản trị -->
    <div class="admin-header">
        <div class="logo">Nova<span>fulse</span> Admin</div>
        <button class="logout-btn" onclick="logoutAdmin()">Đăng xuất hệ thống</button>
    </div>

    <div class="admin-container">
        <!-- Thống kê -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>Tổng số tài khoản thành viên</h4>
                <div class="number" id="total-users">0</div>
            </div>
            <div class="stat-card">
                <h4>Trạng thái bảo mật</h4>
                <div class="number" style="font-size: 20px; color: #00ff88; margin-top: 5px;">Đã xác thực Admin</div>
            </div>
        </div>

        <!-- Bảng quản lý người dùng -->
        <div class="management-section">
            <div class="section-header">
                <h3>Danh sách Tài khoản Người dùng Đã Đăng Ký</h3>
                <button class="add-btn" onclick="addUser()">+ Thêm tài khoản</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Tên đăng nhập</th>
                        <th>Email</th>
                        <th>Mật khẩu</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- Dữ liệu load động từ localStorage -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Kiểm tra phân quyền truy cập Admin
            const isAdmin = sessionStorage.getItem("isAdmin");
            if (!isAdmin) {
                alert("Bạn chưa có quyền truy cập trang quản trị!");
                window.location.href = "sign_in.html";
                return;
            }

            renderTable();
        });

        // Hàm render hiển thị dữ liệu ra bảng
        function renderTable() {
            const users = JSON.parse(localStorage.getItem("users")) || [];
            const tbody = document.getElementById("user-table-body");
            document.getElementById("total-users").textContent = users.length;

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-row">Chưa có người dùng nào đăng ký trong hệ thống.</td></tr>`;
                return;
            }

            let html = "";
            users.forEach((user, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${user.username || user.name || "Không rõ"}</td>
                        <td>${user.email || "Không rõ"}</td>
                        <td>${user.password || "••••••••"}</td>
                        <td>
                            <div class="action-btns">
                                <button class="edit-btn" onclick="editUser(${index})">Sửa</button>
                                <button class="delete-btn" onclick="deleteUser(${index})">Xóa</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // CHỨC NĂNG: Thêm tài khoản mới
        function addUser() {
            const username = prompt("Nhập tên đăng nhập:");
            if (!username) return;
            const email = prompt("Nhập email:");
            if (!email) return;
            const password = prompt("Nhập mật khẩu:");
            if (!password) return;

            let users = JSON.parse(localStorage.getItem("users")) || [];
            users.push({ username, email, password });
            localStorage.setItem("users", JSON.stringify(users));

            renderTable();
            alert("Thêm tài khoản thành công!");
        }

        // CHỨC NĂNG: Sửa thông tin tài khoản
        function editUser(index) {
            let users = JSON.parse(localStorage.getItem("users")) || [];
            const user = users[index];

            const newUsername = prompt("Cập nhật tên đăng nhập:", user.username || user.name || "");
            if (newUsername === null) return;
            const newEmail = prompt("Cập nhật email:", user.email || "");
            if (newEmail === null) return;
            const newPassword = prompt("Cập nhật mật khẩu:", user.password || "");
            if (newPassword === null) return;

            users[index] = {
                ...user,
                username: newUsername,
                email: newEmail,
                password: newPassword
            };

            localStorage.setItem("users", JSON.stringify(users));
            renderTable();
            alert("Cập nhật tài khoản thành công!");
        }

        // CHỨC NĂNG: Xóa tài khoản
        function deleteUser(index) {
            let users = JSON.parse(localStorage.getItem("users")) || [];
            const confirmDelete = confirm(`Bạn có chắc chắn muốn xóa tài khoản: ${users[index].username || users[index].email}?`);

            if (confirmDelete) {
                users.splice(index, 1);
                localStorage.setItem("users", JSON.stringify(users));
                renderTable();
                alert("Đã xóa tài khoản thành công!");
            }
        }

        function logoutAdmin() {
            sessionStorage.clear();
            window.location.href = "sign_up.html";
        }
    </script>
</body>
</html>
